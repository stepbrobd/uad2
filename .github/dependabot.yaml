version: 2

updates:
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 0
    commit-message:
      prefix: "flake"
    groups:
      inputs:
        patterns:
          - "*"
